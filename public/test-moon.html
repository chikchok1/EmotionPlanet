<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Moon</title>
    <style>
        body {
            background-color: #0d1128;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: sans-serif;
        }
        .planet-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .planet-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .layer-base { animation: float 4s ease-in-out infinite; }
        .layer-glow  { animation: float 4s ease-in-out infinite; opacity: 0.6; mix-blend-mode: screen; }
        .layer-face  { animation: float 4s ease-in-out infinite; }
        .layer-sparkles { animation: sparkle 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div>
        <h2 style="text-align: center; margin-bottom: 30px;">레이어 조합된 달</h2>
        <div class="planet-container">
            <img src="figma-assets/moon_base.png"          class="planet-layer layer-base"     alt="달 베이스">
            <img src="figma-assets/moon_effect_glow.png"   class="planet-layer layer-glow"     alt="달 글로우">
            <img src="figma-assets/moon_face_happy.png"    class="planet-layer layer-face"     alt="달 표정">
            <img src="figma-assets/moon_effect_sparkles.png" class="planet-layer layer-sparkles" alt="달 반짝이">
        </div>
    </div>
</body>
</html>
