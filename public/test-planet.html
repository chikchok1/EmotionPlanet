<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Planets</title>
    <style>
        body {
            background-color: #0d1128;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: white;
            font-family: sans-serif;
            box-sizing: border-box;
        }

        h2 {
            margin-bottom: 48px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .planets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 20px;
            max-width: 900px;
            width: 100%;
            justify-items: center;
        }

        .planet-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .planet-card span {
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .planet-container {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .planet-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .layer-glow {
            mix-blend-mode: screen;
            opacity: 0.85;
        }

        .planet-container { animation: none; }
        .layer-base, .layer-face, .layer-clouds, .layer-sparkles { animation: none; }
    </style>
</head>
<body>
    <h2>🌌 Emotion Planets</h2>

    <div class="planets-grid">

        <!-- 수성 Mercury -->
        <div class="planet-card mercury">
            <div class="planet-container">
                <img src="figma-assets/planet_image/mercury.png" class="planet-layer layer-base" alt="수성">
            </div>
            <span>Mercury</span>
        </div>

        <!-- 금성 Venus -->
        <div class="planet-card venus">
            <div class="planet-container">
                <img src="figma-assets/planet_image/venus.png" class="planet-layer layer-base" alt="금성">
            </div>
            <span>Venus</span>
        </div>

        <!-- 지구 Earth -->
        <div class="planet-card earth">
            <div class="planet-container">
                <img src="figma-assets/earth_base.png"            class="planet-layer layer-base"     alt="지구">
                <img src="figma-assets/earth_effect_clouds.png"   class="planet-layer layer-clouds"   alt="구름">
                <img src="figma-assets/earth_effect_sparkles.png" class="planet-layer layer-sparkles" alt="반짝이">
                <img src="figma-assets/earth_face_happy.png"      class="planet-layer layer-face"     alt="표정">
            </div>
            <span>Earth</span>
        </div>

        <!-- 화성 Mars -->
        <div class="planet-card mars">
            <div class="planet-container">
                <img src="figma-assets/planet_image/Mars.png" class="planet-layer layer-base" alt="화성">
            </div>
            <span>Mars</span>
        </div>

        <!-- 목성 Jupiter -->
        <div class="planet-card jupiter">
            <div class="planet-container">
                <img src="figma-assets/planet_image/Jupiter.png" class="planet-layer layer-base" alt="목성">
            </div>
            <span>Jupiter</span>
        </div>

        <!-- 토성 Saturn -->
        <div class="planet-card saturn">
            <div class="planet-container">
                <img src="figma-assets/planet_image/Saturn.png" class="planet-layer layer-base" alt="토성">
            </div>
            <span>Saturn</span>
        </div>

        <!-- 천왕성 Uranus -->
        <div class="planet-card uranus">
            <div class="planet-container">
                <img src="figma-assets/planet_image/Uranus.png" class="planet-layer layer-base" alt="천왕성">
            </div>
            <span>Uranus</span>
        </div>

        <!-- 해왕성 Neptune -->
        <div class="planet-card neptune">
            <div class="planet-container">
                <img src="figma-assets/planet_image/neptune.png" class="planet-layer layer-base" alt="해왕성">
            </div>
            <span>Neptune</span>
        </div>

        <!-- 명왕성 Pluto -->
        <div class="planet-card pluto">
            <div class="planet-container">
                <img src="figma-assets/planet_image/Pluto.png" class="planet-layer layer-base" alt="명왕성">
            </div>
            <span>Pluto</span>
        </div>

    </div>
</body>
</html>
